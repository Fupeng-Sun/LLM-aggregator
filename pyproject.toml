[project]
name = "llmagg"
version = "1.0.0"
description = "Replication code for 'LLM Competition and the Aggregator Economy' (Sun, Liu and Wiesemann)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.5.4",
    "numba==0.68.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmagg"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]          # single-letter names such as l follow the paper's notation

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
